[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tongong001-injectguard_jd211"
version = "0.1.0"
description = "在同一个输入里两两比对，检测提示注入防护工程师·GPU 故障与作业自愈相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tongong001" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tongong001.github.io"
Repository = "https://github.com/tongong001/injectguard_jd211"
Issues = "https://github.com/tongong001/injectguard_jd211/issues"

[project.scripts]
injectguard_jd211 = "injectguard_jd211:main"

[tool.setuptools]
py-modules = ["injectguard_jd211"]
